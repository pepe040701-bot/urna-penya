<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Urna de la Penya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --papel:#f3f5f8; --hoja:#ffffff; --tinta:#1b2140; --tinta-2:#4c5474; --linea:#d5dae6;
  --sello:#c41e3a; --sello-suave:#fbe7ea; --ok:#1f7a4d; --ok-suave:#e3f3ea; --aviso:#8a5a00; --aviso-suave:#fdf1d8;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-texto:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#10131f; --hoja:#191d2e; --tinta:#e8eaf3; --tinta-2:#a3a9c2; --linea:#2c3250;
  --sello:#ff5c73; --sello-suave:#3a1a22; --ok:#5cd39a; --ok-suave:#15301f; --aviso:#f3c26b; --aviso-suave:#33280f;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --papel:#10131f; --hoja:#191d2e; --tinta:#e8eaf3; --tinta-2:#a3a9c2; --linea:#2c3250;
  --sello:#ff5c73; --sello-suave:#3a1a22; --ok:#5cd39a; --ok-suave:#15301f; --aviso:#f3c26b; --aviso-suave:#33280f;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:17px/1.55 var(--f-texto);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.envoltorio{max-width:640px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header.marca{display:flex;align-items:center;gap:12px}
.marca .sello-mini{width:38px;height:38px;flex:none}
.marca b{font:800 1.15rem/1 var(--f-display);letter-spacing:-.01em}
.marca span{display:block;font-size:.8rem;color:var(--tinta-2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
h1{font:800 clamp(1.8rem,6vw,2.5rem)/1.08 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:700 1.25rem/1.2 var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.sub{color:var(--tinta-2)}
.hoja{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.hoja.perforada{border-top:2px dashed var(--linea)}
.etiqueta{font:700 .75rem/1 var(--f-texto);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-2)}
.pila{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.campo{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text],textarea{font:inherit;color:var(--tinta);background:var(--papel);border:1.5px solid var(--linea);border-radius:8px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:140px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.opcion:focus-within{outline:3px solid var(--sello);outline-offset:2px}
button{font:700 1rem/1 var(--f-texto);border-radius:8px;padding:13px 18px;cursor:pointer;border:1.5px solid var(--tinta);background:var(--tinta);color:var(--hoja);min-height:46px}
button.sec{background:transparent;color:var(--tinta);border-color:var(--linea)}
button.peligro{background:var(--sello);border-color:var(--sello);color:#fff}
button.mini{padding:8px 12px;min-height:36px;font-size:.9rem}
button:disabled{opacity:.5;cursor:not-allowed}
.ancho{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 .8rem/1 var(--f-texto);padding:6px 10px;border-radius:999px;background:var(--papel);border:1px solid var(--linea);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tinta-2)}
.chip.preparacion::before{background:var(--tinta-2)}
.chip.papeletas::before{background:var(--aviso)}
.chip.abierta::before{background:var(--ok)}
.chip.cerrada::before{background:var(--sello)}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{border:1px solid var(--linea);border-radius:8px;padding:10px 12px;background:var(--papel)}
.cifra b{display:block;font:800 1.6rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.cifra span{font-size:.8rem;color:var(--tinta-2)}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{display:flex;align-items:center;gap:14px;border:1.5px solid var(--linea);border-radius:var(--r);padding:16px;cursor:pointer;background:var(--hoja)}
.opcion input{position:absolute;opacity:0;pointer-events:none}
.opcion .casilla{width:30px;height:30px;flex:none;border:2px solid var(--tinta);border-radius:6px;display:grid;place-items:center}
.opcion .casilla svg{width:24px;height:24px;opacity:0;transform:scale(.6);transition:transform .15s,opacity .15s}
.opcion:has(input:checked){border-color:var(--sello);background:var(--sello-suave)}
.opcion:has(input:checked) .casilla{border-color:var(--sello)}
.opcion:has(input:checked) .casilla svg{opacity:1;transform:scale(1)}
.opcion .nom{font:700 1.15rem/1.25 var(--f-display);min-width:0;overflow-wrap:anywhere}
.opcion.blanca .nom{font-family:var(--f-texto);font-weight:400;font-style:italic;color:var(--tinta-2)}
.aviso{border-radius:8px;padding:12px 14px;background:var(--aviso-suave);color:var(--tinta);border:1px solid color-mix(in srgb,var(--aviso) 35%,transparent)}
.aviso.ok{background:var(--ok-suave);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.aviso.error{background:var(--sello-suave);border-color:color-mix(in srgb,var(--sello) 40%,transparent)}
.mono{font-family:var(--f-mono);font-weight:500;overflow-wrap:anywhere}
.enlace{font-family:var(--f-mono);font-size:.82rem;background:var(--papel);border:1px dashed var(--linea);border-radius:8px;padding:10px;overflow-wrap:anywhere;user-select:all}
.lista{display:flex;flex-direction:column}
.persona{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--linea)}
.persona:first-child{border-top:0}
.persona .quien{min-width:0}
.persona .quien b{display:block;overflow-wrap:anywhere}
.persona .quien small{color:var(--tinta-2);font-size:.85rem}
.persona .acc{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.barra{height:12px;border-radius:6px;background:var(--papel);border:1px solid var(--linea);overflow:hidden}
.barra i{display:block;height:100%;background:var(--tinta)}
.resultado{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:baseline}
.resultado .nom{font:700 1.1rem/1.25 var(--f-display);min-width:0;overflow-wrap:anywhere}
.resultado .num{font:800 1.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.resultado .barra{grid-column:1/-1}
.resultado.gana .barra i{background:var(--sello)}
.resultado.gana .nom::after{content:" · más votada";font:700 .75rem/1 var(--f-texto);letter-spacing:.06em;text-transform:uppercase;color:var(--sello)}
.urna-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;font-size:.82rem}
.urna-lista div{font-family:var(--f-mono);background:var(--papel);border-radius:6px;padding:6px 8px;overflow-wrap:anywhere}
details{border-top:1px solid var(--linea);padding-top:12px}
details summary{cursor:pointer;font-weight:700}
details .pila{margin-top:10px;color:var(--tinta-2)}
.pasos{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.pasos li{display:flex;gap:10px;align-items:center;color:var(--tinta-2)}
.pasos li::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--linea);flex:none}
.pasos li.hecho{color:var(--tinta)}
.pasos li.hecho::before{background:var(--ok);border-color:var(--ok)}
.pasos li.activo{color:var(--tinta);font-weight:700}
.pasos li.activo::before{border-color:var(--sello);border-top-color:transparent;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.estampa{width:120px;height:120px;margin:4px auto 0;display:block;animation:estampa .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes estampa{from{transform:scale(1.8) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.cargando{color:var(--tinta-2);padding:40px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--hoja);padding:10px 16px;border-radius:8px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
footer{font-size:.85rem;color:var(--tinta-2);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.cifra b{font-size:1.3rem}.persona{grid-template-columns:1fr}.persona .acc{justify-content:flex-start}}
</style>
</head>
<body>
<div class="envoltorio">
  <header class="marca">
    <svg class="sello-mini" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="var(--sello)" stroke-width="3"/><circle cx="20" cy="20" r="11" fill="none" stroke="var(--sello)" stroke-width="1.5" stroke-dasharray="2 2.5"/><path d="M14 20.5l4 4 8-9" fill="none" stroke="var(--sello)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><b>Urna de la Penya</b><span>Voto secreto</span></div>
  </header>
  <main id="app" class="pila" style="gap:20px"><p class="cargando">Cargando…</p></main>
  <footer>Nadie puede saber qué ha votado cada persona: ni la comisión ni quien administra la votación.</footer>
</div>
<script>
"use strict";
const FUNC = "https://nmobdwlirwllzwefdols.supabase.co/functions/v1/votacion";
const app = document.getElementById("app");
const ESTADOS = {preparacion:"En preparación", papeletas:"Repartiendo papeletas", abierta:"Urna abierta", cerrada:"Cerrada"};
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4l18 16M21 4L3 20" stroke="var(--sello)" stroke-width="3.2" stroke-linecap="round"/></svg>';
const SELLO_GRANDE = '<svg class="estampa" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--sello)" stroke-width="5"/><circle cx="60" cy="60" r="44" fill="none" stroke="var(--sello)" stroke-width="2" stroke-dasharray="3 4"/><path d="M40 61l13 13 27-29" fill="none" stroke="var(--sello)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---------------- utilidades ----------------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function params(){ const p = new URLSearchParams(location.hash.slice(1)); return {e:p.get("e"), a:p.get("a"), c:p.get("c"), p:p.get("p")}; }
const base = () => location.origin + location.pathname;
async function api(accion, datos = {}) {
  let r;
  try {
    r = await fetch(FUNC, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({accion, ...datos}), referrerPolicy:"no-referrer", credentials:"omit", cache:"no-store"});
  } catch { throw new Error("No hay conexión con el servidor. Comprueba tu internet y vuelve a intentarlo."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.error || "El servidor no ha respondido bien. Vuelve a intentarlo."); err.status = r.status; throw err; }
  return j;
}
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const leer = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
let toastT;
function toast(msg){ document.querySelector(".toast")?.remove(); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.append(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2200); }
async function copiar(texto, msg = "Copiado"){
  try { await navigator.clipboard.writeText(texto); toast(msg); }
  catch {
    const ta = document.createElement("textarea"); ta.value = texto; ta.style.position="fixed"; ta.style.opacity="0"; document.body.append(ta); ta.select();
    let ok=false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); toast(ok ? msg : "No se pudo copiar: mantén pulsado el texto para copiarlo");
  }
}
function errorHtml(msg){ return `<div class="aviso error" role="alert">${esc(msg)}</div>`; }

// ---------------- criptografía (firma ciega RSA) ----------------
const enc = new TextEncoder();
function b64u(bytes){ let s=""; for (const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function bytesToBig(b){ let h=""; for (const x of b) h+=x.toString(16).padStart(2,"0"); return BigInt("0x"+(h||"0")); }
const big = (h) => BigInt("0x"+h);
function modPow(b,e,m){ let r=1n; b%=m; while(e>0n){ if(e&1n) r=r*b%m; e>>=1n; b=b*b%m; } return r; }
function gcd(a,b){ while(b){ [a,b]=[b,a%b]; } return a; }
function modInv(a,m){ let [r0,r1]=[a%m,m],[s0,s1]=[1n,0n]; while(r1){ const q=r0/r1; [r0,r1]=[r1,r0-q*r1]; [s0,s1]=[s1,s0-q*s1]; } if(r0!==1n) throw new Error("sin inverso"); return ((s0%m)+m)%m; }
async function fdh(msg,n){
  const nBytes=Math.ceil(n.toString(16).length/2), out=new Uint8Array(nBytes);
  let off=0, ctr=0;
  while(off<nBytes){ const h=new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode(msg+"|"+ctr))); out.set(h.subarray(0,Math.min(32,nBytes-off)),off); off+=32; ctr++; }
  out[0]=0; return bytesToBig(out)%n;
}
// Prepara una papeleta secreta y la "mete en el sobre" (cegado)
async function prepararSobre(el){
  const n=big(el.n), e=big(el.e);
  const token=b64u(crypto.getRandomValues(new Uint8Array(24)));
  const m=await fdh(el.id+":"+token,n);
  const nBytes=Math.ceil(n.toString(16).length/2);
  let r;
  do { r=bytesToBig(crypto.getRandomValues(new Uint8Array(nBytes)))%n; } while(r<2n || gcd(r,n)!==1n);
  const ciego=(m*modPow(r,e,n))%n;
  return {token, r:r.toString(16), ciego:ciego.toString(16)};
}
// Quita el sobre a la firma recibida y comprueba que el sello es auténtico
async function abrirSobre(el,sobre,firmaCiega){
  const n=big(el.n), e=big(el.e);
  const s=(big(firmaCiega)*modInv(big(sobre.r),n))%n;
  const m=await fdh(el.id+":"+sobre.token,n);
  if(modPow(s,e,n)!==m) throw new Error("El sello recibido no es válido. Avisa a la comisión.");
  return {token:sobre.token, firma:s.toString(16)};
}

// ---------------- vistas ----------------
function enrutar(){
  const {e,a,c,p} = params();
  window.scrollTo(0,0);
  if (!e) return vistaCrear();
  if (a) return vistaAdmin(e,a);
  if (c) return vistaVotante(e,c);
  if (p) return vistaPapeleta(e,p);
  return vistaPublica(e);
}
window.addEventListener("hashchange", enrutar);

// ---- Crear votación ----
function vistaCrear(){
  document.title = "Urna de la Penya";
  app.innerHTML = `
    <h1>Nueva votación secreta</h1>
    <p class="sub">Crea la votación, apunta a quién puede votar y envía a cada persona su enlace. Funciona igual en la peña y desde casa.</p>
    <form class="hoja" id="f">
      <label class="campo">Título<input type="text" id="titulo" maxlength="120" value="Elección de la dama" required></label>
      <div class="pila">
        <span class="etiqueta">Opciones</span>
        <div class="pila" id="ops"></div>
        <button type="button" class="sec mini" id="masop" style="align-self:flex-start">+ Añadir opción</button>
      </div>
      <label class="fila" style="gap:8px;font-weight:400"><input type="checkbox" id="blanco" checked> Permitir voto en blanco</label>
      <div id="msg"></div>
      <button type="submit" id="crear">Crear votación</button>
    </form>`;
  const ops = app.querySelector("#ops");
  const addOp = (v="") => {
    const i = ops.children.length + 1;
    const d = document.createElement("div"); d.className="fila"; d.style.flexWrap="nowrap";
    d.innerHTML = `<input type="text" maxlength="100" placeholder="Opción ${i}" aria-label="Opción ${i}" id="op${i}" value="${esc(v)}"><button type="button" class="sec mini" aria-label="Quitar opción ${i}">✕</button>`;
    d.querySelector("button").onclick = () => { if (ops.children.length > 2) d.remove(); };
    ops.append(d);
  };
  addOp("Candidata 1"); addOp("Candidata 2");
  app.querySelector("#masop").onclick = () => addOp();
  app.querySelector("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const btn = app.querySelector("#crear"), msg = app.querySelector("#msg");
    const opciones = [...ops.querySelectorAll("input")].map(i=>i.value.trim()).filter(Boolean);
    btn.disabled = true; btn.textContent = "Creando…"; msg.innerHTML = "";
    try {
      const r = await api("crear", {titulo: app.querySelector("#titulo").value, opciones, blanco: app.querySelector("#blanco").checked});
      guardar("urna:admin:"+r.id, r.admin);
      location.hash = `e=${r.id}&a=${r.admin}&nueva=1`;
    } catch (e) { msg.innerHTML = errorHtml(e.message); btn.disabled=false; btn.textContent="Crear votación"; }
  };
}

// ---- Panel de administración ----
async function vistaAdmin(id, admin){
  app.innerHTML = `<p class="cargando">Cargando panel…</p>`;
  let d;
  try { d = await api("admin", {id, admin}); }
  catch (e) { app.innerHTML = errorHtml(e.message); return; }
  document.title = d.titulo + " · Admin";
  const nueva = new URLSearchParams(location.hash.slice(1)).get("nueva");
  const enlaceAdmin = `${base()}#e=${id}&a=${admin}`;
  const enlacePublico = `${base()}#e=${id}`;
  const enlaceDe = (p) => `${base()}#e=${id}&c=${p.codigo}`;
  const mensajeDe = (p) => `Hola ${p.nombre}, este es tu enlace personal para votar en «${d.titulo}». Es solo para ti, no lo reenvíes:\n${enlaceDe(p)}`;
  const siguiente = {
    preparacion: [["papeletas","Empezar a repartir papeletas","sec"],["abierta","Abrir la urna",""]],
    papeletas: [["abierta","Abrir la urna",""]],
    abierta: [["cerrada","Cerrar votación y ver resultados","peligro"]],
    cerrada: [],
  }[d.estado];

  app.innerHTML = `
    ${nueva ? `<div class="aviso"><b>Guarda este enlace de administración.</b> Es la única forma de volver a este panel y no se puede recuperar.<div class="enlace" style="margin-top:8px">${esc(enlaceAdmin)}</div><button class="sec mini" id="cpadmin" style="margin-top:8px">Copiar enlace de administración</button></div>` : ""}
    <div class="pila"><span class="chip ${d.estado}">${ESTADOS[d.estado]}</span><h1>${esc(d.titulo)}</h1>
      <p class="sub">${d.opciones.map(esc).join(" · ")}${d.blanco ? " · voto en blanco" : ""}</p></div>
    <div class="cifras" aria-label="Participación">
      <div class="cifra"><b>${d.votantes}</b><span>con derecho a voto</span></div>
      <div class="cifra"><b>${d.papeletas}</b><span>papeletas recogidas</span></div>
      <div class="cifra"><b>${d.votos}</b><span>votos en la urna</span></div>
    </div>
    ${d.estado !== "cerrada" ? `
    <section class="hoja">
      <h2>Estado de la votación</h2>
      <p class="sub">${{
        preparacion:"Nadie puede votar todavía. Apunta a las personas y envíales su enlace.",
        papeletas:"Cada persona puede abrir su enlace y recoger su papeleta, pero aún no votar. Así el día de la votación nadie puede relacionar la entrega de la papeleta con el voto.",
        abierta:"Se puede votar. Quien no haya recogido su papeleta la recibe al votar.",
      }[d.estado]}</p>
      <div class="fila" id="pasos">${siguiente.map(([k,t,c])=>`<button class="${c}" data-estado="${k}">${t}</button>`).join("")}</div>
      <div id="confirmar"></div>
    </section>` : `<a href="#e=${id}" class="hoja" style="text-decoration:none;color:inherit"><h2>Ver resultados →</h2></a>`}
    <section class="hoja">
      <div class="fila" style="justify-content:space-between"><h2>Personas que votan (${d.lista.length})</h2>
        ${d.lista.length ? `<button class="sec mini" id="cptodos">Copiar todos los mensajes</button>` : ""}</div>
      <p class="sub">Cada persona tiene un enlace propio. Envíaselo por privado. Aquí solo ves si ha recogido su papeleta, nunca lo que ha votado.</p>
      <div class="lista">${d.lista.map(p=>`
        <div class="persona"><div class="quien"><b>${esc(p.nombre)}</b><small>${p.papeleta ? "Papeleta recogida" : "Sin papeleta todavía"} · <span class="mono">${esc(p.codigo.slice(0,4)+"-"+p.codigo.slice(4))}</span></small></div>
          <div class="acc"><button class="sec mini" data-cp="${p.id}">Copiar mensaje</button>${p.papeleta || d.estado==="cerrada" ? "" : `<button class="sec mini" data-quitar="${p.id}" aria-label="Quitar a ${esc(p.nombre)}">Quitar</button>`}</div></div>`).join("") || `<p class="sub">Aún no hay nadie. Añade los nombres abajo.</p>`}
      </div>
      ${d.estado !== "cerrada" ? `
      <label class="campo" style="margin-top:6px">Añadir personas (una por línea)<textarea id="nombres" placeholder="María Ferrer&#10;Laura Roig&#10;…"></textarea></label>
      <div id="msgn"></div>
      <button id="anadir">Añadir a la lista</button>` : ""}
    </section>
    <section class="hoja">
      <h2>Enlace público</h2>
      <p class="sub">Muestra la participación mientras se vota y los resultados al cerrar. Se puede compartir con todos.</p>
      <div class="enlace">${esc(enlacePublico)}</div>
      <button class="sec mini" id="cppub" style="align-self:flex-start">Copiar enlace público</button>
    </section>
    ${explicacion()}`;

  const q = (s) => app.querySelector(s);
  q("#cpadmin")?.addEventListener("click", () => copiar(enlaceAdmin, "Enlace de administración copiado"));
  q("#cppub").onclick = () => copiar(enlacePublico, "Enlace público copiado");
  q("#cptodos")?.addEventListener("click", () => copiar(d.lista.map(mensajeDe).join("\n\n"), "Mensajes copiados"));
  app.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => copiar(mensajeDe(d.lista.find(p=>p.id===b.dataset.cp)), "Mensaje copiado"));
  app.querySelectorAll("[data-quitar]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await api("quitar", {id, admin, votante:b.dataset.quitar}); vistaAdmin(id, admin); } catch (e) { toast(e.message); b.disabled=false; }
  });
  q("#anadir")?.addEventListener("click", async () => {
    const nombres = q("#nombres").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if (!nombres.length) { q("#msgn").innerHTML = errorHtml("Escribe al menos un nombre."); return; }
    q("#anadir").disabled = true;
    try { await api("anadir", {id, admin, nombres}); vistaAdmin(id, admin); }
    catch (e) { q("#msgn").innerHTML = errorHtml(e.message); q("#anadir").disabled=false; }
  });
  app.querySelectorAll("[data-estado]").forEach(b => b.onclick = () => {
    const nuevo = b.dataset.estado;
    const textos = {
      papeletas:"Las personas podrán recoger su papeleta, pero no votar todavía.",
      abierta:"Se podrá votar desde ya. Este paso no se puede deshacer.",
      cerrada:`Nadie más podrá votar y se publicarán los resultados. Han votado ${d.votos} de ${d.votantes}. No se puede deshacer.`,
    };
    q("#confirmar").innerHTML = `<div class="aviso pila"><p>${textos[nuevo]}</p><div class="fila"><button class="${nuevo==="cerrada"?"peligro":""}" id="si">Sí, ${b.textContent.toLowerCase()}</button><button class="sec" id="no">Cancelar</button></div></div>`;
    q("#no").onclick = () => q("#confirmar").innerHTML = "";
    q("#si").onclick = async () => {
      q("#si").disabled = true;
      try { await api("estado", {id, admin, nuevo}); location.hash = `e=${id}&a=${admin}`; vistaAdmin(id, admin); }
      catch (e) { q("#confirmar").innerHTML = errorHtml(e.message); }
    };
  });
}

// ---- Votante con enlace personal ----
async function vistaVotante(id, codigo){
  app.innerHTML = `<p class="cargando">Cargando tu papeleta…</p>`;
  let el, yo;
  try { [el, yo] = await Promise.all([api("info",{id}), api("quien",{id, codigo})]); }
  catch (e) { app.innerHTML = errorHtml(e.message); return; }
  document.title = el.titulo;
  const clave = "urna:"+id;
  const local = leer(clave) || {};
  const cab = `<div class="pila"><span class="chip ${el.estado}">${ESTADOS[el.estado]}</span><h1>${esc(el.titulo)}</h1><p class="sub">Hola, ${esc(yo.nombre)}.</p></div>`;

  if (local.votado) return pantallaVotado(el, local.recibo);
  if (el.estado === "cerrada") { app.innerHTML = cab + `<div class="hoja"><p>La votación ya ha terminado.</p><a href="#e=${id}">Ver resultados</a></div>`; return; }
  if (el.estado === "preparacion") { app.innerHTML = cab + `<div class="hoja"><p>La votación todavía no ha empezado. Vuelve a abrir este mismo enlace cuando la comisión os avise.</p></div>` + explicacion(); return; }

  const tengoPapeleta = !!local.papeleta;
  if (yo.papeleta && !tengoPapeleta && !local.sobre) {
    app.innerHTML = cab + `<div class="hoja pila"><p><b>Tu papeleta ya se recogió</b> en otro móvil o navegador.</p>
      <p class="sub">Si ya votaste, no tienes que hacer nada más. Si la recogiste antes y guardaste el enlace de tu papeleta, ábrelo para votar.</p>
      <p class="sub">El sistema no puede saber si ya has votado: precisamente por eso tu voto es secreto.</p></div>` + explicacion();
    return;
  }

  if (el.estado === "papeletas") {
    if (tengoPapeleta) return pantallaPapeletaGuardada(el, local.papeleta, cab);
    app.innerHTML = cab + `<div class="hoja pila"><p>La urna aún no está abierta, pero ya puedes recoger tu papeleta. Quedará guardada en este móvil para cuando abra la votación.</p>
      <div id="prog"></div><div id="msg"></div><button id="recoger" class="ancho">Recoger mi papeleta</button></div>` + explicacion();
    app.querySelector("#recoger").onclick = async () => {
      const b = app.querySelector("#recoger"); b.disabled = true;
      try { const pap = await conseguirPapeleta(el, codigo, clave, app.querySelector("#prog")); pantallaPapeletaGuardada(el, pap, cab); }
      catch (e) { app.querySelector("#msg").innerHTML = errorHtml(e.message); b.disabled = false; }
    };
    return;
  }

  // Urna abierta
  formularioVoto(el, cab, async (prog) => tengoPapeleta ? local.papeleta : await conseguirPapeleta(el, codigo, clave, prog));
}

async function conseguirPapeleta(el, codigo, clave, progEl){
  const local = leer(clave) || {};
  if (local.papeleta) return local.papeleta;
  pasos(progEl, ["Preparando tu papeleta secreta","Sellando la papeleta a ciegas"], 0);
  const sobre = local.sobre || await prepararSobre(el);
  guardar(clave, {...local, sobre});
  pasos(progEl, ["Preparando tu papeleta secreta","Sellando la papeleta a ciegas"], 1);
  const r = await api("papeleta", {id:el.id, codigo, ciego:sobre.ciego});
  const papeleta = await abrirSobre(el, sobre, r.firma);
  guardar(clave, {papeleta});
  return papeleta;
}

function pantallaPapeletaGuardada(el, pap, cab){
  const enlace = `${base()}#e=${el.id}&p=${pap.token}.${pap.firma}`;
  app.innerHTML = cab + `<div class="hoja pila">${SELLO_GRANDE}<h2 style="text-align:center">Papeleta recogida</h2>
    <p>Está guardada en este móvil. Cuando abra la urna, vuelve a abrir tu enlace personal y podrás votar.</p>
    <div class="aviso pila"><p><b>Por si cambias de móvil o navegador:</b> guarda este enlace de papeleta (por ejemplo, envíatelo a ti mismo). No lleva tu nombre. No se lo pases a nadie: quien lo tenga puede votar con él.</p>
    <div class="enlace">${esc(enlace)}</div><button class="sec mini" id="cp" style="align-self:flex-start">Copiar enlace de papeleta</button></div></div>` + explicacion();
  app.querySelector("#cp").onclick = () => copiar(enlace, "Enlace de papeleta copiado");
}

// ---- Votar con un enlace de papeleta (sin identidad) ----
async function vistaPapeleta(id, p){
  const [token, firma] = (p || "").split(".");
  app.innerHTML = `<p class="cargando">Cargando…</p>`;
  let el; try { el = await api("info",{id}); } catch (e) { app.innerHTML = errorHtml(e.message); return; }
  document.title = el.titulo;
  const clave = "urna:"+id, local = leer(clave) || {};
  if (local.votado) return pantallaVotado(el, local.recibo);
  const cab = `<div class="pila"><span class="chip ${el.estado}">${ESTADOS[el.estado]}</span><h1>${esc(el.titulo)}</h1><p class="sub">Votas con tu papeleta guardada. Este enlace no lleva tu nombre.</p></div>`;
  if (el.estado !== "abierta") { app.innerHTML = cab + `<div class="hoja"><p>${el.estado==="cerrada" ? "La votación ya ha terminado." : "La urna aún no está abierta. Vuelve a abrir este enlace cuando la comisión os avise."}</p></div>`; return; }
  if (!token || !firma) { app.innerHTML = errorHtml("Este enlace de papeleta está incompleto. Cópialo entero."); return; }
  guardar(clave, {...local, papeleta:{token, firma}});
  formularioVoto(el, cab, async () => ({token, firma}));
}

function formularioVoto(el, cab, obtenerPapeleta){
  const ops = el.opciones.map((o,i)=>[i,o]);
  if (el.blanco) ops.push([-1,"Voto en blanco"]);
  app.innerHTML = cab + `
    <form class="hoja perforada pila" id="f">
      <span class="etiqueta">Marca una opción</span>
      <div class="opciones" role="radiogroup">${ops.map(([i,o])=>`
        <label class="opcion${i===-1?" blanca":""}"><input type="radio" name="op" value="${i}" id="op${i}"><span class="casilla">${CHECK}</span><span class="nom">${esc(o)}</span></label>`).join("")}</div>
      <div id="prog"></div><div id="msg"></div>
      <button type="submit" id="votar" class="ancho">Depositar mi voto</button>
      <p class="sub" style="font-size:.9rem">Una vez depositado no se puede cambiar.</p>
    </form>` + explicacion();
  const f = app.querySelector("#f");
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const sel = f.querySelector("input[name=op]:checked");
    const msg = app.querySelector("#msg"), prog = app.querySelector("#prog"), btn = app.querySelector("#votar");
    msg.innerHTML = "";
    if (!sel) { msg.innerHTML = errorHtml("Marca una opción antes de votar."); return; }
    btn.disabled = true; btn.textContent = "Votando…";
    try {
      const pap = await obtenerPapeleta(prog);
      pasos(prog, ["Papeleta preparada y sellada","Depositando el voto en la urna"], 1);
      try { await api("votar", {id:el.id, token:pap.token, firma:pap.firma, opcion:Number(sel.value)}); }
      catch (e) { if (!/ya se ha usado/.test(e.message)) throw e; } // el voto entró y se perdió la respuesta
      const recibo = pap.token.slice(0,8);
      guardar("urna:"+el.id, {votado:true, recibo});
      pantallaVotado(el, recibo);
    } catch (e) {
      prog.innerHTML = ""; msg.innerHTML = errorHtml(e.message);
      btn.disabled = false; btn.textContent = "Depositar mi voto";
    }
  };
}

function pantallaVotado(el, recibo){
  document.title = el.titulo;
  app.innerHTML = `<div class="hoja pila" style="text-align:center">${SELLO_GRANDE}
    <h1>Voto depositado</h1>
    <p class="sub">Gracias. Tu voto está en la urna y nadie puede saber qué has votado.</p>
    ${recibo ? `<p>Comprobante: <span class="mono" style="font-size:1.1rem"><b>${esc(recibo)}</b></span></p>
    <p class="sub" style="font-size:.9rem">Al cerrar la votación, este código aparecerá en la lista pública de papeletas para que compruebes que tu voto se contó. Guárdalo para ti.</p>` : ""}
    <a href="#e=${el.id}">Ver participación y resultados</a></div>`;
}

// ---- Vista pública: participación y resultados ----
async function vistaPublica(id){
  app.innerHTML = `<p class="cargando">Cargando…</p>`;
  let el; try { el = await api("info",{id}); } catch (e) { app.innerHTML = errorHtml(e.message); return; }
  document.title = el.titulo;
  const cab = `<div class="pila"><span class="chip ${el.estado}">${ESTADOS[el.estado]}</span><h1>${esc(el.titulo)}</h1></div>`;
  const cifras = (x) => `<div class="cifras"><div class="cifra"><b>${x.votantes}</b><span>con derecho a voto</span></div><div class="cifra"><b>${x.papeletas}</b><span>papeletas recogidas</span></div><div class="cifra"><b>${x.votos}</b><span>votos en la urna</span></div></div>`;
  if (el.estado !== "cerrada") {
    app.innerHTML = cab + cifras(el) + `<div class="hoja"><p>Los resultados se publicarán aquí en cuanto la comisión cierre la votación.</p><button class="sec mini" id="rec" style="align-self:flex-start">Actualizar</button></div>` + explicacion();
    app.querySelector("#rec").onclick = () => vistaPublica(id);
    return;
  }
  let r; try { r = await api("resultados",{id}); } catch (e) { app.innerHTML = cab + errorHtml(e.message); return; }
  const filas = r.opciones.map((o,i)=>({nom:o, n:r.recuento[i]}));
  const max = Math.max(...filas.map(f=>f.n));
  const total = r.votos || 1;
  const validos = filas.reduce((s,f)=>s+f.n,0);
  const pct = (n) => (n/total*100).toLocaleString("es-ES",{maximumFractionDigits:1})+" %";
  const local = leer("urna:"+id);
  app.innerHTML = cab + `
    <section class="hoja pila" style="gap:18px">
      <h2>Resultados</h2>
      ${filas.map(f=>`<div class="resultado${f.n===max && max>0 && filas.filter(x=>x.n===max).length===1 ? " gana":""}"><span class="nom">${esc(f.nom)}</span><span class="num">${f.n}</span><div class="barra" role="img" aria-label="${pct(f.n)}"><i style="width:${f.n/total*100}%"></i></div></div>`).join("")}
      ${r.blanco ? `<div class="resultado"><span class="nom" style="font-family:var(--f-texto);font-weight:400;font-style:italic">En blanco</span><span class="num">${r.blancos}</span><div class="barra"><i style="width:${r.blancos/total*100}%"></i></div></div>` : ""}
      ${filas.filter(x=>x.n===max).length>1 && max>0 ? `<div class="aviso">Hay un empate en el primer puesto.</div>` : ""}
      <p class="sub">${r.votos} votos de ${r.votantes} personas con derecho a voto (${validos} a opciones${r.blanco?`, ${r.blancos} en blanco`:""}).</p>
    </section>
    <section class="hoja pila">
      <h2>Comprobación pública</h2>
      <p class="sub">Cada voto aparece con su código de comprobante. Quien votó puede buscar el suyo y ver que se contó bien. Ninguno lleva nombre.</p>
      ${local?.recibo ? `<div class="aviso ok">Tu comprobante <span class="mono"><b>${esc(local.recibo)}</b></span> ${r.urna.some(u=>u.t===local.recibo) ? "está en la urna." : "no aparece. Avisa a la comisión."}</div>` : ""}
      <div class="aviso${r.votos <= r.papeletas ? " ok":" error"}">${r.votos <= r.papeletas ? `Cuadra: ${r.votos} votos y ${r.papeletas} papeletas entregadas.` : `No cuadra: hay más votos (${r.votos}) que papeletas entregadas (${r.papeletas}).`}</div>
      <details><summary>Ver las ${r.urna.length} papeletas</summary><div class="urna-lista" style="margin-top:10px">${r.urna.map(u=>`<div>${esc(u.t)} · ${u.o===-1?"blanco":esc(r.opciones[u.o])}</div>`).join("")}</div></details>
    </section>`;
}

function pasos(el, lista, actual){
  if (!el) return;
  el.innerHTML = `<ol class="pasos" aria-live="polite">${lista.map((t,i)=>`<li class="${i<actual?"hecho":i===actual?"activo":""}">${esc(t)}</li>`).join("")}</ol>`;
}

function explicacion(){
  return `<details class="hoja" style="border-top:1px solid var(--linea)"><summary>¿Cómo se garantiza que el voto es secreto?</summary><div class="pila">
    <p><b>1. Tu enlace solo sirve para recoger una papeleta.</b> Tu móvil fabrica una papeleta secreta, la mete en un "sobre" matemático y el servidor la sella sin poder ver qué hay dentro. Así se asegura que cada persona tiene una sola papeleta.</p>
    <p><b>2. Tu móvil quita el sobre y deposita el voto sin tu nombre.</b> En la urna solo entra la papeleta sellada y la opción. El sello demuestra que es válida, pero matemáticamente no se puede saber a quién se le entregó.</p>
    <p><b>3. Nada guarda la hora del voto ni quién lo hizo.</b> Ni la comisión ni quien administra el servidor pueden relacionar un voto con una persona.</p>
    <p><b>4. Se puede comprobar.</b> Al cerrar, se publica la lista de papeletas: cada uno ve que la suya está y que no hay más votos que papeletas entregadas.</p>
  </div></details>`;
}

enrutar();
</script>
